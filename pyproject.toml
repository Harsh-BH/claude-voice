[project]
name = "claude-voice"
version = "0.1.0"
description = "Full-duplex local voice interface for Claude Code: PipeWire WebRTC AEC, Silero VAD, faster-whisper, Kokoro TTS, barge-in"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "claude-agent-sdk>=0.2.181",
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.9",
    "kokoro-onnx>=0.6.1",
    "numpy>=2",
    "textual>=8.2",
]

[project.optional-dependencies]
# cuBLAS 12 is the only CUDA library ctranslate2 4.9 needs (it links cudart statically, no cuDNN).
gpu = ["nvidia-cublas-cu12>=12.9"]
piper = ["piper-tts>=1.8"]

[project.scripts]
voice = "claude_voice.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs the downloaded STT/TTS/VAD models",
    "audio: needs a running PipeWire server (uses silent null sinks)",
    "acoustic: plays sound through the real speaker and records the real mic (VOICE_ACOUSTIC=1)",
    "claude: talks to Claude through your subscription (VOICE_CLAUDE=1)",
]
